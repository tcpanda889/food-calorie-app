        或多模态大模型完成（详见项目 README）。
      </div>
      <div class="btn-row">

      </div>
    </div>
  </div>

  <!-- 拍照：强制调起相机；本地图：仅相册/文件选择 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChange(event)">
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFileChange(event)">

const DEFAULT_API = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "";
let apiBase = localStorage.getItem("fd_api_base") ?? "";

async function detectApiBase() {
  if (localStorage.getItem("fd_api_base")) return;   // 手动配置优先
  try {
    const r = await fetch("api-base.json", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (d.api_base) {
        apiBase = d.api_base;
        $("demoTip").innerHTML = "✅ 已自动接入后端：<b>" + apiBase + "</b>，照片将进行真实识别。";
        return;
      }
    }
  } catch (e) { /* 忽略，走同源/演示模式 */ }
  apiBase = DEFAULT_API;
  if (apiBase) $("demoTip").innerHTML = "✅ 已接入后端接口：<b>" + apiBase + "</b>，照片将进行真实识别。";
}
const $ = id => document.getElementById(id);

function fmt(n) { return Math.round(n * 10) / 10; }

function pickCamera() { $("cameraInput").click(); }   // 手机上直接调起相机
function pickImage() { $("fileInput").click(); }      // 相册/本地文件自由选择

function onFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    currentImage = ev.target.result;
    $("previewImg").src = currentImage;
    $("previewImg").style.display = "block";
    $("previewPlaceholder").style.display = "none";
    $("scanBtn").disabled = false;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
}

/* ============ 识别流程 ============ */
async function startScan() {
  if (!currentImage) return;
  const btn = $("scanBtn");
  btn.disabled = true; btn.textContent = "识别中…";
  $("scanLine").classList.add("active");
  try {
    let result;
    if (apiBase) {
      result = await recognizeViaApi();
    } else {
      await sleep(1800);                 // 模拟 AI 识别耗时
      result = demoRecognize();
    }
    showResult(result, !!apiBase);
    addHistory(result);
  } catch (err) {
    alert("识别失败：" + err.message + "\n已回退到演示模式。");
    showResult(demoRecognize(), false);
    addHistory(demoRecognize());
  } finally {
    $("scanLine").classList.remove("active");
    btn.disabled = false; btn.textContent = "🔍 开始识别";
  }
}

function demoRecognize() {
  const f = FOODS[Math.floor(Math.random() * FOODS.length)];
  return buildResult(f, 0.86 + Math.random() * 0.12);
}

function buildResult(food, confidence) {
  const weight = Math.round(food.weight * (0.85 + Math.random() * 0.3));
  const k = weight / 100;
  return {
    name: food.name, emoji: food.emoji, category: food.cat,
    confidence: confidence,
    per100g: { kcal: food.kcal, protein: food.protein, fat: food.fat, carbs: food.carbs, fiber: food.fiber },
    weightG: weight,
    total: {
      kcal: Math.round(food.kcal * k),
      protein: fmt(food.protein * k), fat: fmt(food.fat * k),
      carbs: fmt(food.carbs * k), fiber: fmt(food.fiber * k)
    },
    tip: food.tip, source: "demo"
  };
}

async function recognizeViaApi() {
  const res = await fetch(apiBase.replace(/\/$/, "") + "/api/recognize", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: currentImage.split(",")[1] })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return Object.assign(data, { source: "api" });
}

/* ============ 结果渲染 ============ */
let lastResult = null;
function showResult(r, isApi) {
  const c = Math.round(r.confidence * 100);
  lastResult = r;
  $("resultArea").innerHTML = `
    <div class="result-card">
      <div class="result-top">
        <div class="result-emoji">${r.emoji}</div>
        <div>
          <div class="result-name">${r.name}
            <span class="${isApi ? "badge-api" : "badge-demo"}">${isApi ? "真实识别" : "演示数据"}</span>
          </div>
          <div class="result-cat">${r.category} · 置信度 ${c}% · 估算重量 ${r.weightG}g</div>
        </div>
      </div>
      <div class="kcal-row">
        <span class="kcal-num">${r.per100g.kcal}</span>
        <span class="kcal-unit">千卡 / 100克</span>
      </div>
      <div class="kcal-label">营养成分（每100g）</div>
      <div class="macros">
        <div class="macro"><div class="v">${r.per100g.protein}g</div><div class="k">蛋白质</div></div>
        <div class="macro"><div class="v">${r.per100g.fat}g</div><div class="k">脂肪</div></div>
        <div class="macro"><div class="v">${r.per100g.carbs}g</div><div class="k">碳水化合物</div></div>
        <div class="macro"><div class="v">${r.per100g.fiber}g</div><div class="k">膳食纤维</div></div>
      </div>
      <div class="total-banner">
        <span>本次摄入估算（${r.weightG}g）</span>
        <span><b>${r.total.kcal}</b> 千卡</span>
      </div>
      <div class="tip">💡 ${r.tip}</div>
    </div>
    <div class="recheck-bar">
      <div class="recheck-title">🔁 对结果有疑问？让 AI 复检</div>
      <div class="recheck-hint">输入文字或点击 🎤 语音说出命令，大模型将重新看图检验，并联动百度交叉复核</div>
      <div class="recheck-row">
        <input id="recheckInput" class="recheck-input" placeholder="例如：我觉得是苹果，请重新检验"
               onkeydown="if(event.key==='Enter')aiRecheck()">
        <button id="voiceBtn" class="recheck-btn voice-btn" title="语音输入" onclick="toggleVoice()">🎤</button>
        <button id="recheckBtn" class="recheck-btn" onclick="aiRecheck()">🔄 复检</button>
      </div>
      <div class="recheck-chips">
        <button class="chip" onclick="chipRecheck('我觉得识别错了，请重新仔细看图检验')">我觉得识别错了</button>
        <button class="chip" onclick="chipRecheck('请重新仔细观察数量、果形和表皮纹理')">请重新仔细看图</button>
        <button class="chip" onclick="chipRecheck('请对比所有易混淆的候选食物再下结论')">列出易混淆候选</button>
      </div>
    </div>`;
  $("resultArea").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ============ AI 复检（文字 / 语音命令） ============ */
function chipRecheck(t) {
  $("recheckInput").value = t;
  aiRecheck();
}

async function aiRecheck() {
  if (!lastResult) return;
  if (!apiBase) { alert("演示模式不支持 AI 复检，请点击右上角 ⚙ 配置后端接口地址。"); return; }
  if (!currentImage) { alert("请先拍照或选择图片再复检。"); return; }
  const input = $("recheckInput");
  const text = (input.value || "").trim() || "请重新仔细检验识别结果是否正确";
  const btn = $("recheckBtn");
  btn.disabled = true; btn.textContent = "复检中…";
  try {
    const res = await fetch(apiBase.replace(/\/$/, "") + "/api/recheck", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image_base64: currentImage.split(",")[1], user_text: text })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || ("HTTP " + res.status));
    }
    const data = await res.json();
    data.source = "api";
    showResult(data, true);
    addHistory(data);
  } catch (err) {
    alert("复检失败：" + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "🔄 复检";
    if ($("recheckInput")) $("recheckInput").value = text;
  }
}

let recog = null, recogActive = false;
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $("voiceBtn");
  if (!SR) {
    alert("当前浏览器不支持网页语音识别。请使用 Chrome / Edge 浏览器，或安卓版微信内置浏览器打开。");
    return;
  }
  if (recogActive) { recog && recog.stop(); return; }
  recog = new SR();
  recog.lang = "zh-CN";
  recog.interimResults = true;
  recog.continuous = false;
  recog.onstart = () => {
    recogActive = true;
    micBtn.textContent = "⏹";
    micBtn.classList.add("listening");
    $("recheckInput").placeholder = "正在聆听，请说出复检命令…";
  };
  recog.onresult = e => {
    let t = "";
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    $("recheckInput").value = t;
  };
  const _stop = () => {
    recogActive = false;
    micBtn.textContent = "🎤";
    micBtn.classList.remove("listening");
    const inp = $("recheckInput");
    if (inp) inp.placeholder = "例如：我觉得是苹果，请重新检验";
  };
  recog.onend = _stop;
  recog.onerror = e => { _stop(); if (e.error !== "aborted" && e.error !== "no-speech") alert("语音识别失败：" + e.error + "（请检查麦克风权限）"); };
  recog.start();
}

/* ============ 历史记录 ============ */
function addHistory(r) {
  const list = JSON.parse(localStorage.getItem("fd_history") || "[]");
  list.unshift({ name: r.name, emoji: r.emoji, kcal: r.total.kcal, time: new Date().toLocaleString("zh-CN", { hour12: false }) });
  localStorage.setItem("fd_history", JSON.stringify(list.slice(0, 50)));
  renderHistory();
}
function renderHistory() {
  const list = JSON.parse(localStorage.getItem("fd_history") || "[]");
  $("historyCard").innerHTML = list.length
    ? list.map(h => `<div class="history-item">
        <span class="emoji">${h.emoji}</span>
        <div class="info"><div class="n">${h.name}</div><div class="t">${h.time}</div></div>
        <span class="k">${h.kcal} 千卡</span></div>`).join("")
    : `<div class="empty">暂无记录，快去拍一张吧 📷</div>`;
}
function clearHistory() { localStorage.removeItem("fd_history"); renderHistory(); }

/* ============ 示例格子 ============ */
const SAMPLE_EMOJIS = ["🍎","🍌","🥦","🍗","🍚","🍔","🧋","🥟","🍓","🐟","🍰","🥑"];
function renderSamples() {
  $("sampleGrid").innerHTML = SAMPLE_EMOJIS.map(e => {
    const f = FOODS.find(x => x.emoji === e);
    return f ? `<div class="sample-item" onclick="sampleScan('${f.name}')">
      <div class="emoji">${e}</div><div class="name">${f.name}</div></div>` : "";
  }).join("");
}
async function sampleScan(name) {
  const f = FOODS.find(x => x.name === name);
  $("scanLine").classList.add("active");
  $("scanBtn").textContent = "识别中…";
  await sleep(1000);
  $("scanLine").classList.remove("active");
  $("scanBtn").textContent = "🔍 开始识别";
  const r = buildResult(f, 0.9);
  showResult(r, false); addHistory(r);
}

/* ============ 设置 ============ */
function openSettings() { $("apiInput").value = apiBase; $("settingsMask").classList.add("show"); }
function closeSettings() { $("settingsMask").classList.remove("show"); }
function saveSettings() {
  apiBase = $("apiInput").value.trim();
  localStorage.setItem("fd_api_base", apiBase);
  closeSettings();
  $("demoTip").innerHTML = apiBase
    ? "✅ 已接入后端接口：<b>" + apiBase + "</b>，照片将进行真实识别。"
    : "💡 当前为<b>演示模式</b>（识别结果为模拟数据）。点击右上角 ⚙ 可配置后端接口地址。";
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

renderSamples();
renderHistory();
detectApiBase();
</script>
